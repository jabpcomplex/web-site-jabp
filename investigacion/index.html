<body>
<header class="header">

    <nav>

<main class="main-container">
    <section class="content-section">
        <h2>Archivos de Investigación</h2>
        <ul id="lista-articulos" class="doc-list"></ul>
    </section>
</main>

<footer>
    <p>2025 jabpcomplex ©opyleft.</p>
</footer>

<script>
    // archivos md de investigación
    const articulos = [
        { nombre: "¿Puede la comida de un hombre en Wuhan (China) causar una pandemia global?", archivo: "viewer.html?file=article_1_enpoli.md"},
        { nombre: "Historia del Web Scraping: evolución, IA y Cloudflare", archivo: "viewer.html?file=historia_web_scraping_01.md"}
    ];

    const lista = document.getElementById("lista-articulos");
    articulos.forEach(doc => {
        const li = document.createElement("li");
        li.innerHTML = `<a href="${doc.archivo}" target="_blank">${doc.nombre}</a>`;
        lista.appendChild(li);
    });
</script>
