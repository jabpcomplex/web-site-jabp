<body>
<header class="header">

    <nav>

<main class="main-container">
    <section class="content-section">
        <h2>Mis Artículos de Opinión</h2>
        <p>Lista de escritos disponibles:</p>
        <ul id="lista-reseñas" class="doc-list"></ul>
    </section>
</main>

<footer>
    <p>2025 jabpcomplex ©opyleft.</p>
</footer>

<script>
    // Archivos disponibles (añade aquí tus reseñas .md)
    const reseñas = [
        { nombre: "Sobre la reunión de territorios de paz", archivo: "viewer.html?file=opinion_1.md" },
        { nombre: "El futuro de la IA es incierto pero no desalentador", archivo: "viewer.html?file=opinion_2_futuro_de_la_IA.md"}
        
        
    ];

    const lista = document.getElementById("lista-reseñas");
    reseñas.forEach(doc => {
        const li = document.createElement("li");
        li.innerHTML = `<a href="${doc.archivo}" target="_blank">${doc.nombre}</a>`;
        lista.appendChild(li);
    });
</script>
